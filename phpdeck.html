					CORE TRACK   = slide horizontal (panah kanan/kiri)  -> dipresentasikan 150 menit
					SELF-STUDY   = slide vertical   (panah bawah)       -> dibaca mandiri

					Separator di file .md:
					  3 baris kosong = slide horizontal berikutnya (CORE)
					  2 baris kosong = slide vertical  (SELF-STUDY)
					  "Note:"        = speaker notes (maksimal SATU per slide)
				-->
				<section

					data-separator="^\r?\n\r?\n\r?\n\r?\n"
